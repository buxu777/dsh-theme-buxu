<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="不虚 · 质肤">
  <!-- 六道竖向色条：六套配色的强调色。
       隐喻「六套主题」，在 96px 卡片上仍可辨识。
       底色近黑 + 细描边，浅色/深色商店背景都能立住。 -->
  <rect x="0" y="0" width="180" height="180" rx="40" fill="#101012"/>
  <rect x="0.75" y="0.75" width="178.5" height="178.5" rx="39.25" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>

  <g>
    <rect x="21"  y="21" width="18" height="138" rx="9" fill="#A5ADB6"/>
    <rect x="45"  y="21" width="18" height="138" rx="9" fill="#62BC8F"/>
    <rect x="69"  y="21" width="18" height="138" rx="9" fill="#5D8AC6"/>
    <rect x="93"  y="21" width="18" height="138" rx="9" fill="#9681CF"/>
    <rect x="117" y="21" width="18" height="138" rx="9" fill="#465F72"/>
    <rect x="141" y="21" width="18" height="138" rx="9" fill="#8D5E35"/>
  </g>

  <!-- 顶部一道极淡的高光，避免整块死平 -->
  <rect x="21" y="21" width="138" height="138" rx="9" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
</svg>
